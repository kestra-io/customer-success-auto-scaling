# Apply into the namespace from which Kestra workers can resolve the Service, e.g.:
#   kubectl apply -n <namespace> -f test_setup/kubernetes/localstack-sqs.yaml
#
# This is test-only. It exposes only LocalStack's edge port and enables SQS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack-sqs
  labels:
    app.kubernetes.io/name: localstack-sqs
    app.kubernetes.io/component: test-message-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack-sqs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack-sqs
        app.kubernetes.io/component: test-message-queue
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8.1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICES
              value: sqs
            # Path-style queue URLs retain the host used by the client request,
            # avoiding localhost queue URLs that Kestra worker pods cannot reach.
            - name: SQS_ENDPOINT_STRATEGY
              value: path
            - name: DEBUG
              value: "0"
            # LocalStack's plugin loader writes a Python cache, so direct it to
            # the image's writable /tmp rather than trying to create /.cache.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            # The image's /tmp/localstack may be owned by its build-time UID.
            - name: CLEAR_TMP_FOLDER
              value: "0"
            # SQS clients use the ClusterIP Service directly; LocalStack's
            # optional DNS listener needs privileged port 53 and is unnecessary.
            - name: DNS_ADDRESS
              value: "0"
          ports:
            - name: edge
              containerPort: 4566
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: edge
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
      volumes:
        # Ephemeral by design. Queue state is lost when the pod is recreated.
        - name: localstack-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack-sqs
  labels:
    app.kubernetes.io/name: localstack-sqs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: localstack-sqs
  ports:
    - name: edge
      port: 4566
      targetPort: edge
      protocol: TCP
