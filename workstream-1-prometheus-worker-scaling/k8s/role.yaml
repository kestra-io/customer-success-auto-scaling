apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-scaler
  namespace: {{NAMESPACE}}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # discover worker pod IPs to scrape their :8081/prometheus directly
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
