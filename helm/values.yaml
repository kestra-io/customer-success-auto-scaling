# Distributed Kestra for the auto-scaling example.


image:
  repository: ${KESTRA_IMAGE_REPO}
  tag: "${KESTRA_IMAGE_TAG}"

# Rendered only for the EE image; scripts/up.sh sets imagePullSecrets=[] for OSS.
imagePullSecrets:
  - name: kestra-registry

deployments:
  standalone:
    enabled: false

  indexer:
    enabled: false

  webserver:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 300m, memory: 1200Mi }
      limits:   { memory: 1792Mi }

  executor:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 900Mi }
      limits:   { memory: 1280Mi }

  scheduler:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 700Mi }
      limits:   { memory: 1024Mi }

  worker:
    enabled: true
    replicas: 1
    workerThreads: 4          # chart renders `--thread=4` on the worker process
    resources:
      requests: { cpu: 250m, memory: 800Mi }
      limits:   { memory: 1152Mi }

# No container task runner in this demo — the Sleep task runs on a worker thread.
dind:
  enabled: false

service:
  type: ClusterIP
  ports:
    http:
      port: 8080
    management:
      port: 8081

ingress:
  enabled: false

configurations:
  application:
    kestra:
      anonymousUsageReport:
        enabled: false

common:
  extraEnvFrom:
    - secretRef:
        name: kestra-sensitive

extraManifests:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: kestra-sensitive
    stringData:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basicAuth:
              enabled: true
              username: "${KESTRA_ADMIN_USER}"
              password: "${KESTRA_ADMIN_PASSWORD}"
          security:
            super-admin:
              username: "${KESTRA_ADMIN_USER}"
              password: "${KESTRA_ADMIN_PASSWORD}"
              tenant-admin-access:
                - main
          repository:
            type: postgres
          queue:
            type: postgres
          jdbc:
            queues:
              # Default poll-size is 100: one worker's subscriber leases a huge
              # batch of taskruns into its local buffer and a second worker
              # starves -> horizontal worker scaling adds no throughput. A small
              # poll-size plus an always-aggressive poll interval (min == max, so
              # an idle worker never backs off) makes the queue spread work
              # evenly across every worker pod.
              poll-size: 2
              min-poll-interval: 20ms
              max-poll-interval: 20ms
          storage:
            type: local
            local:
              base-path: "/app/storage"
          secret:
            type: jdbc
            jdbc:
              secret: "${KESTRA_JDBC_SECRET}"
          encryption:
            secret-key: "${KESTRA_ENCRYPTION_SECRET_KEY}"
          ee:
            license:
              id: "${KESTRA_EE_LICENSE_ID}"
              fingerprint: "${KESTRA_EE_LICENSE_FINGERPRINT}"
              key: "${KESTRA_EE_LICENSE_KEY}"
          anonymousUsageReport:
            enabled: false
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        micronaut:
          security:
            token:
              jwt:
                signatures:
                  secret:
                    generator:
                      secret: "${KESTRA_JWT_SECRET}"
              cookie:
                cookie-max-age: 10h

  # In-cluster Postgres.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: kestra-postgres-secret
    stringData:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: kestra-postgres
    spec:
      selector:
        matchLabels:
          app: kestra-postgres
      serviceName: kestra-postgres
      replicas: 1
      template:
        metadata:
          labels:
            app: kestra-postgres
        spec:
          containers:
            - name: postgres
              image: postgres:16
              envFrom:
                - secretRef:
                    name: kestra-postgres-secret
              ports:
                - containerPort: 5432
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  - apiVersion: v1
    kind: Service
    metadata:
      name: kestra-postgres
    spec:
      selector:
        app: kestra-postgres
      ports:
        - port: 5432

  # Worker metrics are exposed only on each worker pod's own :8081 
  #   no cross-service aggregation at webserver level.
  # so we need a Service that selects the worker pods. The scaler scrapes worker
  # pod IPs directly for an authoritative sum; this Service is what the host-side
  # port-forward (and the trigger app's /stats readout) use.
  - apiVersion: v1
    kind: Service
    metadata:
      name: kestra-worker-metrics
    spec:
      selector:
        app.kubernetes.io/name: kestra
        app.kubernetes.io/component: worker
      ports:
        - name: management
          port: 8081
          targetPort: 8081
