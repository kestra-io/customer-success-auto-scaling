# Distributed Kestra for the auto-scaling example.
#
# Rendered by scripts/up.sh through a small sed pass (no envsubst dependency) that
# substitutes ONLY the ${...} tokens below. This committed file contains NO
# secrets — the image-pull secret is created imperatively by
# scripts/create-secrets.sh; the license + internal secrets come from .env at
# render time into the kestra-sensitive Secret.
#
# Trim of ../../infra/my-kestra/values.yaml with three deliberate changes:
#   * basic auth ON with demo creds (${KESTRA_ADMIN_USER}) + matching super-admin.
#     EE keeps an auth layer regardless of the OSS basicAuth flag, so we use known
#     creds rather than fighting it. The webhook (URL-keyed) and :8081/prometheus
#     stay anonymous; only the data/management API and the UI need the creds.
#   * deployments.worker.workerThreads: 4      (deterministic concurrency ceiling)
#   * dind.enabled: false                      (Sleep needs no runner; faster pods)
#
# IMPORTANT: the whole Kestra config lives in the kestra-sensitive Secret's
# KESTRA_CONFIGURATION value, NOT in `configurations.application`. The image's
# /app/kestra launcher, when KESTRA_CONFIGURATION is set, writes it to
# /app/confs/application.yml and forces MICRONAUT_CONFIG_FILES to point there,
# which would otherwise clobber the chart's own config file.

image:
  repository: ${KESTRA_IMAGE_REPO}
  tag: "${KESTRA_IMAGE_TAG}"

# Rendered only for the EE image; scripts/up.sh sets imagePullSecrets=[] for OSS.
imagePullSecrets:
  - name: kestra-registry

deployments:
  standalone:
    enabled: false

  webserver:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 300m, memory: 1536Mi }   # no limits: JVM headroom on a laptop

  executor:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 768Mi }

  indexer:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 512Mi }

  scheduler:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 512Mi }

  worker:
    enabled: true
    replicas: 1
    workerThreads: 4          # chart renders `--thread=4` on the worker process
    resources:
      requests: { cpu: 250m, memory: 768Mi }

# No container task runner in this demo — the Sleep task runs on a worker thread.
dind:
  enabled: false

service:
  type: ClusterIP
  ports:
    http:
      port: 8080
    management:
      port: 8081

ingress:
  enabled: false

# The chart requires configurations.application to be non-empty, but at runtime
# /app/kestra forces MICRONAUT_CONFIG_FILES to /app/confs/application.yml (built
# from KESTRA_CONFIGURATION), so this stub is never actually read. The real
# config is the KESTRA_CONFIGURATION value in the kestra-sensitive Secret below.
configurations:
  application:
    kestra:
      anonymousUsageReport:
        enabled: false

common:
  extraEnvFrom:
    - secretRef:
        name: kestra-sensitive

extraManifests:
  # The COMPLETE Kestra configuration (rendered from .env at bring-up).
  # /app/kestra writes this to /app/confs/application.yml and points
  # MICRONAUT_CONFIG_FILES at it.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: kestra-sensitive
    stringData:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basicAuth:
              enabled: true
              username: "${KESTRA_ADMIN_USER}"
              password: "${KESTRA_ADMIN_PASSWORD}"
          security:
            super-admin:
              username: "${KESTRA_ADMIN_USER}"
              password: "${KESTRA_ADMIN_PASSWORD}"
              tenant-admin-access:
                - main
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          secret:
            type: jdbc
            jdbc:
              secret: "${KESTRA_JDBC_SECRET}"
          encryption:
            secret-key: "${KESTRA_ENCRYPTION_SECRET_KEY}"
          ee:
            license:
              id: "${KESTRA_EE_LICENSE_ID}"
              fingerprint: "${KESTRA_EE_LICENSE_FINGERPRINT}"
              key: "${KESTRA_EE_LICENSE_KEY}"
          anonymousUsageReport:
            enabled: false
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
        micronaut:
          security:
            token:
              jwt:
                signatures:
                  secret:
                    generator:
                      secret: "${KESTRA_JWT_SECRET}"
              cookie:
                cookie-max-age: 10h

  # In-cluster Postgres.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: kestra-postgres-secret
    stringData:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: kestra-postgres
    spec:
      selector:
        matchLabels:
          app: kestra-postgres
      serviceName: kestra-postgres
      replicas: 1
      template:
        metadata:
          labels:
            app: kestra-postgres
        spec:
          containers:
            - name: postgres
              image: postgres:16
              envFrom:
                - secretRef:
                    name: kestra-postgres-secret
              ports:
                - containerPort: 5432
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  - apiVersion: v1
    kind: Service
    metadata:
      name: kestra-postgres
    spec:
      selector:
        app: kestra-postgres
      ports:
        - port: 5432
